<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540"><rect width="1000" height="540" rx="16" fill="#080f1e"/><style>text{font-family:Arial;fill:#def7ff}.sub{font-size:15px;fill:#a3bdd2}.box{fill:#11273b;stroke:#38c8dd;stroke-width:2}</style><text x="45" y="55" font-size="30">Jarvis: your interface, your local tools</text><text x="45" y="84" class="sub">Architecture illustration - no personal data shown</text><rect class="box" x="45" y="145" width="260" height="115" rx="12"/><text x="65" y="181" font-size="22">You choose the input</text><text x="65" y="213" class="sub">Voice / text / chosen snapshot</text><text x="65" y="239" class="sub">Visible capture controls</text><path d="M305 202 H365" stroke="#38c8dd" stroke-width="3"/><rect class="box" x="365" y="145" width="270" height="115" rx="12"/><text x="385" y="181" font-size="22">Jarvis on your Mac</text><text x="385" y="213" class="sub">Whisper / Piper / local vision</text><text x="385" y="239" class="sub">Routines / notes / tool results</text><path d="M635 202 H695" stroke="#38c8dd" stroke-width="3"/><rect class="box" x="695" y="145" width="260" height="115" rx="12"/><text x="715" y="181" font-size="22">External services</text><text x="715" y="213" class="sub">OpenRouter free-only chat</text><text x="715" y="239" class="sub">Websites / optional integrations</text><rect class="box" x="120" y="340" width="760" height="115" rx="12"/><text x="145" y="377" font-size="22">Private runtime state stays outside Git</text><text x="145" y="411" class="sub">Keys / sessions / browser profile / personal notes / databases / captures</text><text x="45" y="505" class="sub">Cloud chat receives relevant request context. Local-first does not mean every service is offline.</text></svg>